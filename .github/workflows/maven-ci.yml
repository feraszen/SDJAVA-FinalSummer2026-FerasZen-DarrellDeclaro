name: Maven CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'refactor/**'
      - 'fix/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_management"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d gym_management -f database/schema.sql
          psql -h localhost -U postgres -d gym_management -f database/seed.sql
          psql -h localhost -U postgres -d gym_management -f database/test-data.sql

      - name: Build and test
        env:
          GYM_DB_URL: jdbc:postgresql://localhost:5432/gym_management
          GYM_DB_USER: postgres
          GYM_DB_PASSWORD: postgres
        run: mvn -B clean test package

      - name: Console smoke tests
        env:
          GYM_DB_URL: jdbc:postgresql://localhost:5432/gym_management
          GYM_DB_USER: postgres
          GYM_DB_PASSWORD: postgres
        run: |
          set -e

          printf 'admin\nGymAdmin@2026\n3\n4\n1\n5\n7\n' \
            | java -jar target/gym-management-system-1.0-SNAPSHOT.jar > /tmp/admin-smoke.txt

          grep -q 'Login successful.' /tmp/admin-smoke.txt
          grep -q 'Total Membership Revenue: $465.00' /tmp/admin-smoke.txt
          grep -q 'Total Inventory Valuation: $1337.50' /tmp/admin-smoke.txt
          grep -q 'Logged out successfully.' /tmp/admin-smoke.txt

          printf 'trainer1\nTrainer@2026\n1\n2\n1\n5\n5\n' \
            | java -jar target/gym-management-system-1.0-SNAPSHOT.jar > /tmp/trainer-smoke.txt

          grep -q 'Login successful.' /tmp/trainer-smoke.txt
          grep -q 'MY ASSIGNED CLASSES' /tmp/trainer-smoke.txt
          grep -q 'Beginner Yoga' /tmp/trainer-smoke.txt
          grep -q 'Logged out successfully.' /tmp/trainer-smoke.txt

          printf 'member1\nMember@2026\n3\n6\n' \
            | java -jar target/gym-management-system-1.0-SNAPSHOT.jar > /tmp/member-smoke.txt

          grep -q 'Login successful.' /tmp/member-smoke.txt
          grep -q 'WORKOUT CLASSES' /tmp/member-smoke.txt
          grep -q 'Logged out successfully.' /tmp/member-smoke.txt
