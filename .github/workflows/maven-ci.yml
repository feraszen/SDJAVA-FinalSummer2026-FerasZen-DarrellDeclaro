name: Maven CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'refactor/**'
      - 'fix/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_management"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d gym_management -f database/schema.sql
          psql -h localhost -U postgres -d gym_management -f database/seed.sql
          psql -h localhost -U postgres -d gym_management -f database/test-data.sql

      - name: Build and test
        env:
          GYM_DB_URL: jdbc:postgresql://localhost:5432/gym_management
          GYM_DB_USER: postgres
          GYM_DB_PASSWORD: postgres
        run: mvn -B clean test package
